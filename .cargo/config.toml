# Windows (MSVC): link the C runtime statically, so Sideroute.exe does not need the Visual C++
# Redistributable (VCRUNTIME140.dll) to start.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
