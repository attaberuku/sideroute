[workspace]
resolver = "3"
members = ["crates/proto", "crates/net", "crates/server", "crates/client", "crates/windows"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/attaberuku/sideroute"

[workspace.dependencies]
sideroute-proto = { path = "crates/proto" }
sideroute-net = { path = "crates/net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
